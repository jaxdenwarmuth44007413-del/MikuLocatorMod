name: Build Mod Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Auto Extract and Build
        run: |
          # 1. 如果仓库里传的是 zip 压缩包，自动解压
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} \; 2>/dev/null || true

          find . -type f -name "*.gradle*" -exec sed -i '1s/^\xef\xbb\xbf//' {} +

          # 2. 全盘搜寻 src 目录，自动提到根目录
          find . -type d -name "src" | while read -r srcdir; do
            parent=$(dirname "$srcdir")
            if [ "$parent" != "." ]; then
              echo "Found project files inside $parent, copying to root..."
              cp -rf "$parent"/* . 2>/dev/null || true
            fi
          done

          # 3. 检查代码是否就绪
          if [ ! -d "src/main/java" ]; then
            echo "ERROR: src/main/java not found!"
            find . -maxdepth 3
            exit 1
          fi

          echo "✅ Source files detected:"
          ls -la src/main/java/com/miku/coordinateselector/

          # 4. 自动补全 settings.gradle
          if [ ! -f "settings.gradle" ]; then
            cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { url = 'https://maven.minecraftforge.net/' }
              }
          }
          EOF
          fi

          # 5. 自动补全 build.gradle
          if [ ! -f "build.gradle" ]; then
            cat << 'EOF' > build.gradle
          plugins {
              id 'eclipse'
              id 'idea'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }

          group = 'com.miku'
          version = '1.0.0'

          base {
              archivesName = 'coordinate_selector'
          }

          sourceCompatibility = targetCompatibility = '17'

          minecraft {
              mappings channel: 'official', version: '1.20.1'
              copyIdeResources = true
          }

          repositories {
              maven { url = 'https://maven.minecraftforge.net/' }
              mavenCentral()
          }

          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
          }

          tasks.named('processResources', ProcessResources).configure {
              var replaceProperties = [
                      minecraft_version: '1.20.1',
                      minecraft_version_range: '[1.20.1,1.21)',
                      forge_version: '47.2.0',
                      forge_version_range: '[47,)',
                      loader_version_range: '[47,)',
                      mod_id: 'coordinate_selector',
                      mod_name: 'Coordinate Selector',
                      mod_license: 'MIT',
                      mod_version: '1.0.0',
                      mod_authors: 'Miku Fans',
                      mod_description: 'Coordinate Selector for Wormhole'
              ]
              inputs.properties replaceProperties

              filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
                  expand replaceProperties + [project: project]
              }
          }

          tasks.named('jar', Jar).configure {
              manifest {
                  attributes([
                          'Specification-Title'     : 'coordinate_selector',
                          'Specification-Vendor'    : 'miku',
                          'Specification-Version'   : '1',
                          'Implementation-Title'    : project.name,
                          'Implementation-Version'  : project.jar.archiveVersion,
                          'Implementation-Vendor'   : 'miku',
                          'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
                  ])
              }
              finalizedBy 'reobfJar'
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }
          EOF
          fi

          # 6. 正式编译全部 class 和资源
          gradle build --no-daemon

      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: coordinate_selector-1.0.0
          path: build/libs/*.jar
